[workspace]
resolver = "3"
members = ["apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
http-body-util = "0.1"
mime_guess = "2"
rust-embed = { version = "8.13", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 单二进制优先：体积与启动速度比极限吞吐更重要。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
